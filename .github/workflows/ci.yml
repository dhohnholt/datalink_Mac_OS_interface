name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: macos-14
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .
      - name: Test
        run: python -m unittest discover -s tests -t tests -v
      - name: Smoke test the workspace
        run: |
          datalink-scanner --version
          datalink-scanner serve --no-browser --port 8799 --capture-dir "$RUNNER_TEMP/captures" &
          sleep 3
          curl -sf http://127.0.0.1:8799/ | grep -q "Scanner workspace"
          curl -sf http://127.0.0.1:8799/api/status | grep -q disconnected
          curl -sf -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8799/api/quit

  app-bundle:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e .
      - name: Build the launcher bundle
        run: |
          packaging/make_app_bundle.sh \
            --cli "$(command -v datalink-scanner)" \
            --output "$RUNNER_TEMP" \
            --version "0.0.0-ci"
          plutil -lint "$RUNNER_TEMP/DataLink Scanner.app/Contents/Info.plist"
          test -x "$RUNNER_TEMP/DataLink Scanner.app/Contents/MacOS/DataLink Scanner"
