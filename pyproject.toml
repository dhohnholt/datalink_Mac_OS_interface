[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datalink-scanner"
version = "1.3.0"
description = "macOS interface for the Apperson DataLink 1200 optical mark scanner"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Hohnholt" }]
keywords = ["omr", "scanner", "apperson", "datalink", "education", "grading"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Education",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Topic :: Education :: Testing",
]
dependencies = [
  "pyserial>=3.5",
  "pyobjc-framework-Cocoa>=10.0",
  "pyobjc-framework-WebKit>=10.0",
]

[project.urls]
Homepage = "https://github.com/dhohnholt/datalink_Mac_OS_interface"
Source = "https://github.com/dhohnholt/datalink_Mac_OS_interface"
Issues = "https://github.com/dhohnholt/datalink_Mac_OS_interface/issues"

[project.scripts]
datalink-scanner = "datalink_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
datalink_scanner = ["webui/*", "resources/*"]
